name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ['3.11', '3.13']
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile and test
        run: python scripts/check.py --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  package:
    name: Build and isolated wheel install
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install build frontend
        run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Test wheel outside checkout and preserve cleanup evidence
        run: |
          python scripts/smoke_wheel.py dist 2>&1 | Tee-Object -FilePath smoke-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-installation
          path: smoke-windows.log
          retention-days: 7
      - name: Preserve exact checkout for reproducible acceptance
        run: git archive --format=tar.gz --output=dist/source-checkout.tar.gz HEAD
      - name: Add isolated installer and checksums
        run: |
          Copy-Item -LiteralPath scripts/install.py -Destination dist/install.py
          python -c "from pathlib import Path; import hashlib; d=Path('dist'); d.joinpath('SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(d.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-workspace-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Workbench / real HTTP and Chromium
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install test-only browser dependencies
        run: |
          python -m pip install -e ".[test]" playwright==1.57.0
          python -m playwright install chromium
      - name: Test real workbench with isolated Git data
        env:
          AW_BROWSER_TESTS: '1'
        run: python -m pytest tests/test_workbench_browser.py -q
