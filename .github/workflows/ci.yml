name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ['3.11', '3.13']
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile and test
        run: python scripts/check.py --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  package:
    name: Build and isolated wheel install
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install build frontend
        run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Test wheel outside checkout and preserve cleanup evidence
        run: |
          python scripts/smoke_wheel.py dist 2>&1 | Tee-Object -FilePath smoke-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-installation
          path: smoke-windows.log
          retention-days: 7
      - name: Preserve exact checkout for reproducible acceptance
        run: git archive --format=tar.gz --output=dist/source-checkout.tar.gz HEAD
      - name: Add isolated installer and checksums
        run: |
          Copy-Item -LiteralPath scripts/install.py -Destination dist/install.py
          python -c "from pathlib import Path; import hashlib; d=Path('dist'); d.joinpath('SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(d.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-workspace-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Workbench / real HTTP and Chromium
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install test-only browser dependencies
        run: |
          python -m pip install -e ".[test]" playwright==1.57.0
          python -m playwright install chromium
      - name: Test real workbench with isolated Git data
        env:
          AW_BROWSER_TESTS: '1'
        run: python -m pytest tests/test_workbench_browser.py -q

  stage-workbench-v04-directory:
    if: github.event_name == 'pull_request' && github.head_ref == 'automation/workbench-v04-directory-staging-20261010'
    name: Stage verified Workbench commit
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Reconstruct and verify patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem .aw-staging/workbench-v04-directory/*.b64 | Sort-Object Name
          $encoded = ($parts | ForEach-Object { Get-Content -Raw $_.FullName }) -join ''
          $compressed = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\workbench.patch.xz", $compressed)
          @'
          from pathlib import Path
          import hashlib, lzma, os
          root = Path(os.environ["RUNNER_TEMP"])
          compressed = (root / "workbench.patch.xz").read_bytes()
          assert hashlib.sha256(compressed).hexdigest() == "29f818b8fa38035d979cb2cc19174225d43d64f5fc960bda8cd50cb0d9f54605"
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == "6c01b7e832d4c57c19816e369c109b6c4cfa8eebb2a9cb4bb7f02d23fe80b0b1"
          (root / "workbench.patch").write_bytes(patch)
          '@ | python -
      - name: Apply to exact base, test, and push one commit
        shell: pwsh
        run: |
          git config user.name "Agent Workspace"
          git config user.email "aw@localhost"
          git config core.autocrlf false
          git reset --hard 051f60a519250fd2c20c0453fef93f7d9ddbf310
          git clean -fdx
          git apply --check "$env:RUNNER_TEMP\workbench.patch"
          git apply "$env:RUNNER_TEMP\workbench.patch"
          git diff --check
          python -m pip install -e ".[test]"
          python -m pytest -q tests/test_workbench_v04.py tests/test_support_guidance.py tests/test_smoke_cleanup.py tests/test_onboarding.py tests/test_workbench_state.py
          @'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ("index.html", "setup.html"):
              text = (Path("src/agent_workspace/resources") / name).read_text(encoding="utf-8")
              script = re.search(r"<script>(.*)</script>", text, re.S).group(1)
              path = Path(tempfile.gettempdir()) / (name + ".js")
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          '@ | python -
          git add README.md docs/first-use.md docs/runtime-and-maintenance.md docs/usage.md docs/workbench.md src/agent_workspace/onboarding.py src/agent_workspace/resources/index.html src/agent_workspace/resources/setup.html src/agent_workspace/server.py tests/test_workbench_browser.py tests/test_workbench_v04.py
          git commit -m "feat: implement Workbench 0.4 and instance directory selection"
          git push origin HEAD:refs/heads/workbench/workbench-v04-directory-20261010
