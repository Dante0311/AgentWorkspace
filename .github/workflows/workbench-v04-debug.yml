name: Diagnose Workbench browser waits

on:
  push:
    branches:
      - fix/workbench-v04-ci-20261010

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Add temporary diagnostics
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/test_workbench_browser.py')
          text = path.read_text(encoding='utf-8')
          old = '    page.wait_for_function("!busy && !pendingMessage()")\n'
          new = '''    try:\n        page.wait_for_function("!busy && !pendingMessage()", timeout=10000)\n    except Exception:\n        print("MESSAGE_DIAG", page.evaluate("({busy, pending: pendingMessage(), error: document.getElementById('error').textContent, lastResult, view, installation: state.installation_id})"))\n        raise\n'''
          if text.count(old) != 1:
              raise SystemExit(f'message wait matches: {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '    page.wait_for_function("!document.getElementById(\'dialog\').open && !busy")\n'
          new = '''    try:\n        page.wait_for_function("!document.getElementById('dialog').open && !busy", timeout=10000)\n    except Exception:\n        print("GRANT_DIAG", page.evaluate("({busy, open: document.getElementById('dialog').open, description: document.getElementById('dialog-description').textContent, error: document.getElementById('error').textContent, lastResult, selected: document.getElementById('f-agent_id')?.value})"))\n        raise\n'''
          if text.count(old) < 1:
              raise SystemExit('grant wait not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Install Chromium test dependencies
        run: |
          python -m pip install -e ".[test]" playwright==1.57.0
          python -m playwright install chromium
      - name: Run only the two failing scenarios
        env:
          AW_BROWSER_TESTS: '1'
        run: python -m pytest tests/test_workbench_browser.py::test_message_response_loss_continues_only_original_request tests/test_workbench_browser.py::test_caretaker_grants_are_explicit_and_revocable -vv -s
