name: Apply Workbench v0.4 CI fix

on:
  push:
    branches:
      - fix/workbench-v04-ci-20261010

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply exact Workbench fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              with target.open("w", encoding="utf-8", newline="\n") as stream:
                  stream.write(text)

          index = "src/agent_workspace/resources/index.html"
          replace_once(index, ".result-drawer{position:fixed;right:", ".result-drawer{position:fixed;pointer-events:none;right:")
          replace_once(index, ".result-head button{color:#e9f4ee}", ".result-head button{color:#e9f4ee;pointer-events:auto}")
          replace_once(index, ".mobile-menu{display:none}", ".mobile-menu,.sidebar-close{display:none}")
          replace_once(index, ".mobile-menu{display:inline-flex}.topbar", ".mobile-menu{display:inline-flex}.sidebar-close{display:grid;margin-left:auto}.topbar")
          replace_once(index,
              '<div><strong>Agent Workspace</strong><small>WORKBENCH 0.4</small></div></div><div class="switch">',
              '<div><strong>Agent Workspace</strong><small>WORKBENCH 0.4</small></div><button id="close-mobile-menu" class="icon-btn sidebar-close" aria-label="关闭导航">×</button></div><div class="switch">')
          replace_once(index,
              '<button id="mobile-menu" class="btn quiet mobile-menu" aria-label="打开导航">菜单</button>',
              '<button id="mobile-menu" class="btn quiet mobile-menu" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">菜单</button>')
          replace_once(index,
              "function showResult(value){lastResult=value;$('result-output').textContent=JSON.stringify(value,null,2);$('result').classList.remove('hidden')}\nfunction setError",
              "function showResult(value){lastResult=value;$('result-output').textContent=JSON.stringify(value,null,2);$('result').classList.remove('hidden')}\nfunction setSidebar(open){$('sidebar').classList.toggle('open',open);$('mobile-menu').setAttribute('aria-expanded',String(open))}\nfunction setError")
          replace_once(index,
              "function runtimeFields(a={},kind='codex'){return [",
              "function runtimeFields(a={},kind='codex'){kind=['codex','claude','codebuddy'].includes(kind)?kind:'codex';return [")
          replace_once(index,
              "$('mobile-menu').onclick=()=>$('sidebar').classList.toggle('open');$('steward-shortcut')",
              "$('mobile-menu').onclick=()=>setSidebar(!$('sidebar').classList.contains('open'));$('close-mobile-menu').onclick=()=>{setSidebar(false);$('mobile-menu').focus()};$('steward-shortcut')")
          replace_once(index,
              "if(nav){view=nav.dataset.view;selectedAgent=null;$('sidebar').classList.remove('open');render();return}",
              "if(nav){view=nav.dataset.view;selectedAgent=null;setSidebar(false);render();return}")
          replace_once(index,
              "document.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;",
              "document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sidebar').classList.contains('open')){setSidebar(false);$('mobile-menu').focus();return}if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;")

          setup = "src/agent_workspace/resources/setup.html"
          replace_once(setup,
              "const result=await command('setup.create',args);show(result);await loadState();if(state.workspaces.some(w=>w.alias===args.name)){$('workspace').value=args.name;chooseAgents()}return result",
              "const result=await command('setup.create',args);await loadState();if(state.workspaces.some(w=>w.alias===args.name)){$('workspace').value=args.name;chooseAgents()}show(result);return result")
          replace_once(setup,
              "const result=await command('setup.prepare-instance',{...chosen(),directory:$('instance-directory').value.trim()});show(result);await loadState();return result",
              "const result=await command('setup.prepare-instance',{...chosen(),directory:$('instance-directory').value.trim()});await loadState();show(result);return result")

          browser = "tests/test_workbench_browser.py"
          replace_once(browser, "page.set_default_timeout(15000)", "page.set_default_timeout(45000)")
          replace_once(browser,
              'assert str(target.resolve()) in page.locator("#result-output").inner_text()',
              'assert page.evaluate("lastResult.directory") == str(target.resolve())')
          replace_once(browser,
              'def test_workbench_forms_and_recovery_fit_viewport(ui, viewport):\n    _, _, page = ui\n    page.set_viewport_size(viewport)\n    if viewport["width"] < 700:\n        page.locator("#mobile-menu").click()\n',
              'def test_workbench_forms_and_recovery_fit_viewport(ui, viewport):\n    _, _, page = ui\n    page.set_viewport_size(viewport)\n    if viewport["width"] < 700:\n        menu = page.locator("#mobile-menu")\n        menu.click()\n        assert menu.get_attribute("aria-expanded") == "true"\n        page.locator("#close-mobile-menu").click()\n        assert menu.get_attribute("aria-expanded") == "false"\n')

          v04 = "tests/test_workbench_v04.py"
          replace_once(v04,
              'subprocess.run([node, "--check", "-"], input=script, text=True, capture_output=True)',
              'subprocess.run([node, "--check", "-"], input=script, text=True, encoding="utf-8", capture_output=True)')
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run focused checks
        run: python -m pytest tests/test_workbench_v04.py tests/test_setup_interfaces.py -q
      - name: Commit the verified fix and remove this helper
        shell: pwsh
        run: |
          git diff --check
          git config user.name "Agent Workspace"
          git config user.email "aw@localhost"
          git add -- src/agent_workspace/resources/index.html src/agent_workspace/resources/setup.html tests/test_workbench_browser.py tests/test_workbench_v04.py
          git rm -- .github/workflows/workbench-v04-fix.yml
          git commit -m "Fix Workbench browser interactions and Windows checks"
          git push origin HEAD:${{ github.ref_name }}
