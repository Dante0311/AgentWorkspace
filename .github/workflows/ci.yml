name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ['3.11', '3.13']
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile and test
        run: python scripts/check.py --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  package:
    name: Build and isolated npm / wheel install
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install build frontend
        run: python -m pip install build
      - name: Test Web Courier worker and page behavior with fixtures
        run: node --test extensions/web-courier/tests/*.test.mjs
      - name: Compile and build sdist and wheel
        run: |
          python -m compileall -q src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build
      - name: Build Windows npm artifact with bundled runtime
        run: python scripts/build_npm.py dist
      - name: Package the unpacked Chrome extension and its instructions
        run: Compress-Archive -LiteralPath extensions/web-courier/extension,extensions/web-courier/README.md -DestinationPath dist/web-courier.zip
      - name: Test npm installation and replacement outside checkout
        run: |
          python scripts/smoke_npm.py dist 2>&1 | Tee-Object -FilePath smoke-npm-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test wheel outside checkout and preserve cleanup evidence
        run: |
          python scripts/smoke_wheel.py dist 2>&1 | Tee-Object -FilePath smoke-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-installation
          path: |
            smoke-windows.log
            smoke-npm-windows.log
          retention-days: 7
      - name: Preserve exact checkout for reproducible acceptance
        run: git archive --format=tar.gz --output=dist/source-checkout.tar.gz HEAD
      - name: Add isolated installer and checksums
        run: |
          Copy-Item -LiteralPath scripts/install.py -Destination dist/install.py
          python -c "from pathlib import Path; import hashlib; d=Path('dist'); d.joinpath('SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(d.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-workspace-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Workbench / real HTTP and Chromium
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install test-only browser dependencies
        run: |
          python -m pip install -e ".[test]" playwright==1.57.0
          python -m playwright install chromium
      - name: Test real workbench with isolated Git data
        env:
          AW_BROWSER_TESTS: '1'
        run: python -m pytest tests/test_workbench_browser.py -q
