name: Native SDK contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install claude-agent-sdk==0.2.163 codebuddy-agent-sdk==0.3.267
      - run: python scripts/check_native_sdks.py
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/test_native_sdk.py tests/test_native_failure.py -q
      - name: Exercise the SDK's installed Claude binary against an isolated local API
        run: |
          export AW_TEST_CLAUDE="$(python -c 'from pathlib import Path; import claude_agent_sdk; print(Path(claude_agent_sdk.__file__).parent / "_bundled" / "claude")')"
          test -x "$AW_TEST_CLAUDE"
          python -m pytest tests/test_claude_native.py -q
      - name: Exercise the SDK's installed CodeBuddy binary against an isolated local API
        run: |
          export AW_TEST_CODEBUDDY="$(python -c 'from pathlib import Path; import codebuddy_agent_sdk; print(Path(codebuddy_agent_sdk.__file__).parent / "bin" / "codebuddy-headless")')"
          test -x "$AW_TEST_CODEBUDDY"
          python -m pytest tests/test_codebuddy_native.py -q
      - name: Preserve dependencies for offline protocol tests
        run: |
          python -m pip freeze --exclude git-native-agent-workspace > native-test-requirements.txt
          python -m pip download --only-binary=:all: -r native-test-requirements.txt pytest -d native-test-dependencies
          npm install --prefix native-test-dependencies/codex @openai/codex@0.160.0
      - name: Exercise installed Codex and cross-Harness transfer against a local API
        run: |
          export AW_TEST_CODEBUDDY="$(python -c 'from pathlib import Path; import codebuddy_agent_sdk; print(Path(codebuddy_agent_sdk.__file__).parent / "bin" / "codebuddy-headless")')"
          test -x "$AW_TEST_CODEBUDDY"
          export AW_TEST_CLAUDE="$(python -c 'from pathlib import Path; import claude_agent_sdk; print(Path(claude_agent_sdk.__file__).parent / "_bundled" / "claude")')"
          test -x "$AW_TEST_CLAUDE"
          python -m pytest tests/test_codex_native.py tests/test_native_transfer.py -q
        env:
          AW_TEST_CODEX: ${{ github.workspace }}/native-test-dependencies/codex/node_modules/.bin/codex
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-sdk-contract
          path: native-sdk-contract.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-test-dependencies
          path: |
            native-test-dependencies/
            native-test-requirements.txt
          if-no-files-found: error
          retention-days: 1
