<body>
<header><div class="brand"><span class="logo">AW</span><div><h1>Agent Workspace</h1><div class="sub header-sub">独立的工作空间，共享的协作记录。</div></div></div><span class="tag">0.1 · Alpha</span></header>
<main>
<p class="muted"><a href="/capabilities" target="_blank" rel="noopener noreferrer">当前版本支持范围与限制</a> · 当前不支持与尚未验证分开说明。</p>
<section id="auth" class="card hidden"><h2>连接本机工作台</h2><p class="muted">使用启动命令输出的完整地址，或在此输入本机控制 Token。Token 不会发送到外部服务。</p><input id="token" type="password" autocomplete="off" aria-label="本机控制 Token"><button class="btn primary" id="login" style="margin-top:14px">连接</button></section>
<div id="app" class="hidden">
<div class="bar"><div><h2 id="section-title">我的 Agent</h2><p class="muted">会话仍在你选择的 Desktop、CLI 或其他界面中进行。</p></div><div class="buttons"><select class="filter" id="filter" aria-label="Workspace 筛选"></select><button class="btn" id="refresh">刷新状态</button><button class="btn primary" id="create">创建 Agent</button></div></div>
<nav class="tabs" aria-label="主要视图"><button data-tab="agents" class="active">Agent</button><button data-tab="workspaces">Workspace</button><button data-tab="collaboration">消息与工单</button></nav>
<div id="error" role="alert"></div><section id="content"></section>
<section id="result" class="hidden"><div class="bar"><h3>操作结果</h3><button class="btn" id="copy">复制</button></div><p class="muted">按返回状态判断实际进度。已写入不等于已确认通知，预留入口不等于新会话已就绪。</p><div id="links"></div><pre id="output"></pre></section>
<div class="foot">V1 · 身份归属一个 Workspace · Work 与共享 Definition 可选 · 本页面不是聊天客户端</div>
</div>
</main>
<dialog id="dialog"><form id="form"><h2 id="form-title"></h2><p class="muted" id="form-description"></p><div id="fields"></div><div class="form-actions"><button type="button" class="btn" id="cancel">取消</button><button type="submit" class="btn primary" id="submit">执行</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);let token=new URLSearchParams(location.hash.slice(1)).get('token')||sessionStorage.getItem('aw-token')||'';
if(location.hash)history.replaceState(null,'',location.pathname);let state={workspaces:[],agents:[]},tab='agents',submitAction=null,lastResult;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
function button(text,fn,primary=false){const b=el('button',text,'btn'+(primary?' primary':''));b.onclick=fn;return b}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok||v.ok===false)throw new Error(v.error||'请求失败');return v.result}
async function command(name,args){return api('/api/execute',{command:name,arguments:args})}
function show(value){lastResult=value;$('result').classList.remove('hidden');$('output').textContent=JSON.stringify(value,null,2);$('links').replaceChildren();if(value&&value.open_url&&value.open_url.startsWith('codex://')){const a=el('a','打开新 Desktop 会话');a.href=value.open_url;$('links').append(a)}$('result').scrollIntoView({behavior:'smooth',block:'nearest'})}
async function act(name,args){try{$('error').textContent='';show(await command(name,args));await load()}catch(e){$('error').textContent=e.message}}
async function load(){try{$('refresh').disabled=true;state=await api('/api/state');$('auth').classList.add('hidden');$('app').classList.remove('hidden');const selected=$('filter').value;$('filter').replaceChildren(new Option('全部 Workspace',''));for(const w of state.workspaces)$('filter').add(new Option(w.alias,w.alias));$('filter').value=selected;render();$('error').textContent=state.errors.map(x=>x.workspace+'：'+x.error).join('\n')}catch(e){$('auth').classList.remove('hidden');$('error').textContent=e.message}finally{$('refresh').disabled=false}}
function workspace(){const v=$('filter').value||state.workspaces[0]?.alias;if(!v)throw new Error('请先创建或接入一个 Workspace。');return v}
function form(title,description,fields,callback){$('form-title').textContent=title;$('form-description').textContent=description;$('fields').replaceChildren();for(const f of fields){const label=el('label',f.label);label.htmlFor='f-'+f.key;let input;if(f.options){input=el('select');for(const [v,t] of f.options)input.add(new Option(t,v))}else input=el(f.multiline?'textarea':'input');input.id='f-'+f.key;input.name=f.key;input.value=f.value??(f.options?f.options[0][0]:'');input.required=!!f.required;input.dataset.kind=f.kind||'text';if(f.placeholder)input.placeholder=f.placeholder;$('fields').append(label,input);if(f.help)$('fields').append(el('div',f.help,'help'))}submitAction=callback;$('dialog').showModal()}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{const a={};for(const input of $('fields').querySelectorAll('input,textarea,select')){if(input.value==='')continue;a[input.name]=input.dataset.kind==='json'?JSON.parse(input.value):input.value}const result=await submitAction(a);$('dialog').close();show(result);await load()}catch(e){$('form-description').textContent=e.message}finally{$('submit').disabled=false}};
$('cancel').onclick=()=>$('dialog').close();$('refresh').onclick=load;$('filter').onchange=render;$('login').onclick=()=>{token=$('token').value;sessionStorage.setItem('aw-token',token);load()};$('copy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(lastResult,null,2));
for(const t of document.querySelectorAll('[data-tab]'))t.onclick=()=>{tab=t.dataset.tab;render()};
function base(a){return {workspace:a.workspace,agent_id:a.id}}
function render(){for(const t of document.querySelectorAll('[data-tab]'))t.classList.toggle('active',t.dataset.tab===tab);$('section-title').textContent={agents:'我的 Agent',workspaces:'协作空间',collaboration:'消息与正式工单'}[tab];$('content').replaceChildren();if(tab==='agents')renderAgents();if(tab==='workspaces')renderWorkspaces();if(tab==='collaboration')renderCollaboration()}
function renderAgents(){const agents=state.agents.filter(a=>!$('filter').value||a.workspace===$('filter').value);if(!agents.length){const box=el('div',undefined,'empty');box.append(el('h3','先建立一个长期存在的工作者'),el('p','先创建或接入 Workspace，再创建 Agent。没有 Definition 和任务也可以开始；平台不会替你安排试做任务。','muted'),button('创建 / 接入 Workspace',addWorkspace,true));$('content').append(box);return}const grid=el('div',undefined,'grid');for(const a of agents){const card=el('article',undefined,'card'),tag=el('span',a.archived?'已归档':a.binding?.phase||'尚未进入','tag');card.append(tag,el('h3',a.name,'name'),el('div',a.workspace+' / '+a.id,'muted'));if(a.description)card.append(el('p',a.description,'muted'));const kv=el('div',undefined,'kv');for(const [key,val] of [['当前入口',a.binding?.kind||'未绑定'],['会话',a.binding?.session||'尚无已确认会话'],['自动投递',a.watch?.enabled?'已启用':'关闭'],['运行器',(a.runtime?.state||'未运行')+(a.runtime?.runner_alive===false&&a.runtime?.pid?'（历史观测，进程已停止）':'')]])kv.append(el('span',key),el('span',val));card.append(kv);const actions=el('div',undefined,'buttons');actions.append(button('详情',()=>act('agent.show',base(a))),button('配置',()=>configureAgent(a)),button('Desktop 配置',()=>configureDesktop(a)));if(!a.current&&!a.archived)actions.append(button('进入新会话',()=>act('agent.start',{...base(a),open_app:false}),true));if(a.current){actions.append(button('交出',()=>act('agent.handoff',base(a))),button('换新会话',()=>act('agent.handoff',{...base(a),renew:true})),button('切换 Harness',()=>transferAgent(a)),button(a.watch?.enabled?'关闭投递':'开启投递',()=>act('message.watch',{...base(a),operation:a.watch?.enabled?'stop':'start'})),button('启动运行器',()=>act('runtime.start',base(a))))}actions.append(button('交接进度',()=>act('agent.transfer-status',base(a))),button('继续原交接',()=>act('agent.transfer-continue',base(a))),button('资料',()=>act('asset.list',base(a))),button('检查点',()=>checkpoints(a)),button('版本差异',()=>act('agent.versions',base(a))));if(!a.current)actions.append(button(a.archived?'解除归档':'归档',()=>act('agent.archive',{...base(a),archived:!a.archived})));card.append(actions);grid.append(card)}$('content').append(grid)}
function runtimeFields(a){return [
 {key:'kind',label:'运行环境（原生 CLI；不代表 Desktop）',options:[['codex','Codex CLI'],['claude','Claude Code CLI / SDK'],['codebuddy','CodeBuddy Code CLI / SDK']],value:['codex','claude','codebuddy'].includes(a.configured_kind)?a.configured_kind:'codex'},
 {key:'model',label:'模型 ID（可选）'}, {key:'effort',label:'推理强度（以服务实际支持为准）'},
 {key:'base_url',label:'自有服务 URL（可选）',help:'Codex 需要 Responses 协议；Claude/CodeBuddy 需要各自原生协议。不自动转换 API。'},
 {key:'env_key',label:'凭据环境变量名，不填写密钥'}, {key:'executable',label:'可执行路径（可选，留空从 PATH 查找）'}];}
function configureAgent(a){form('配置原生运行环境','仅保存，不启动模型；活动实例请使用“切换 Harness”。SDK 需先安装对应可选依赖，不会代装。',runtimeFields(a),v=>{const kind=v.kind;delete v.kind;return command(kind==='codex'?'agent.configure-codex':'agent.configure-sdk',{...base(a),...v,...(kind==='codex'?{}:{kind})})})}
function configureDesktop(a){form('Desktop / 手动入口配置','本版仅提供 Codex Desktop 的手动控制连接配置，接口待实机确认；不支持完整自动创建或自动跨端交接。Claude/WorkBuddy Desktop 未接入，不用 CLI 替代。',[{key:'value',label:'运行配置 JSON',kind:'json',multiline:true,required:true,value:JSON.stringify({kind:'desktop'},null,2)}],v=>command('agent.configure',{...base(a),...v}))}
function transferAgent(a){const request_id=crypto.randomUUID();form('切换 Harness 并接手','先预检目标，再请求旧会话保存并交出。新会话成功绑定且完成 relay 后才算完成；失败请查看原交接，不要重复创建。',runtimeFields(a),v=>command('agent.transfer-profile',{...base(a),...v,request_id}))}
function scheduleMaintenance(w){form('配置巡检计划','程序负责定时。只有工作台服务或 aw maintenance run 运行时才执行；通知会进入已启动 Sentinel，会产生模型调用。',[{key:'enabled',label:'计划',options:[['false','停止'],['true','启用']]},{key:'interval',label:'间隔（秒，至少 30）',value:'300'},{key:'notify',label:'发现异常时通知巡检员',options:[['false','只保存报告，不调用模型'],['true','通知当前 Sentinel 会话']]}],v=>command('maintenance.schedule',{workspace:w.alias,enabled:v.enabled==='true',interval:Number(v.interval),notify:v.notify==='true'}))}
function caretakerGrant(w){form('管家操作授权','只授权登记的管家；留空操作数组即撤销。授权仅限本安装和此 Workspace，不是操作系统隔离。',[{key:'agent_id',label:'管家实例 ID',required:true},{key:'commands',label:'明确允许的操作数组',kind:'json',required:true,value:'[]',help:'例如 ["maintenance.schedule","maintenance.repair"]。不能委托授权管理、任意进程配置或原始 transfer 配置。'},{key:'targets',label:'目标实例 ID 数组',kind:'json',required:true,value:'[]',help:'[] 只允许自身；["alice"] 指定目标；["*"] 明确授权本 Workspace 全部实例。'}],v=>command('maintenance.grant',{workspace:w.alias,...v}))}
function repairWorkspace(w){const request_id=crypto.randomUUID();form('执行限定维修','先查看健康报告，填写报告中的目标和预期状态。重复同一请求只查询原结果；不删除锁、不接管、不重放模型任务。',[{key:'agent_id',label:'目标实例 ID',required:true},{key:'action',label:'动作',options:[['sync-idle','同步已交出实例的资料'],['publication-reconcile','补齐原发布操作'],['bridge-retry','允许当前已启用桥接重试']]},{key:'operation_id',label:'原发布 operation ID（补齐时必填）'},{key:'bridge',label:'桥接名称（桥接重试时必填）'},{key:'expected_binding',label:'报告中的当前 Binding（桥接重试时必填）'},{key:'expected_generation',label:'报告中的桥接 generation（桥接重试时必填）'}],v=>command('maintenance.repair',{workspace:w.alias,...v,request_id}))}

function checkpoints(a){form('保存 / 查看检查点','保存范围限实际文件，外部产品与不可取得的原生状态不会被伪装成完整备份。',[{key:'summary',label:'累计摘要',multiline:true,help:'留空则查看已保存检查点。'},{key:'content',label:'阶段事实与不确定性',multiline:true}],v=>command(v.summary?'checkpoint.create':'checkpoint.list',v.summary?{...base(a),...v,binding:a.current}:base(a)))}
function addWorkspace(){location.href='/setup';}
function renderWorkspaces(){const row=el('div',undefined,'buttons');row.append(button('创建 / 接入 Workspace',addWorkspace,true));$('content').append(row);for(const w of state.workspaces){const card=el('article',undefined,'card');card.style.marginTop='16px';card.append(el('h3',w.alias),el('p',w.address,'muted'));const actions=el('div',undefined,'buttons');actions.append(button('查看',()=>act('workspace.show',{workspace:w.alias})),button('健康检查',()=>act('workspace.doctor',{workspace:w.alias})),button('巡检状态',()=>act('maintenance.status',{workspace:w.alias})),button('巡检计划',()=>scheduleMaintenance(w)),button('管家授权',()=>caretakerGrant(w)),button('限定维修',()=>repairWorkspace(w)));for(const [kind,label] of [['friends','好友'],['projects','产品']])actions.append(button('管理'+label,()=>form('管理'+label,'只管理关联，不删除资源，不自动为对方登记。',[{key:'operation',label:'动作',options:[['list','查看'],['add','增加'],['remove','移除']]},{key:'alias',label:'简称'},{key:'address',label:'访问地址（增加时填写）'},{key:'content',label:'用途'}],a=>command('workspace.relation',{workspace:w.alias,kind,...a}))));card.append(actions);$('content').append(card)}}
function renderCollaboration(){const card=el('section',undefined,'card');card.append(el('h3','明确发送，按需使用 Work'),el('p','ACK 只表示已确认通知，不代表已读或已完成。工单不是 Agent 运行的前提。','muted'));const buttons=el('div',undefined,'buttons');buttons.append(button('消息列表',()=>act('message.list',{workspace:workspace()})),button('发送消息',()=>form('发送 Message','使用当前有效入口发送；跨 Workspace 由 Backend 完成双写。',[{key:'agent_id',label:'发送实例 ID',required:true},{key:'binding',label:'当前 binding',required:true},{key:'to',label:'接收者（实例 ID 或 好友/实例）',required:true},{key:'delivery',label:'投递方式',help:'先核对目标入口；本版 Claude/CodeBuddy SDK 不支持 insert，队头不会自动降级。',options:[['normal','normal：等空闲'],['insert','insert：仅支持此能力的入口，不插队']]},{key:'content',label:'正文',required:true,multiline:true}],a=>command('message.send',{workspace:workspace(),...a}))),button('工单列表',()=>act('work.list',{workspace:workspace()})),button('创建工单',()=>form('创建 Work','创建只保存工单，不自动通知、启动模型或发布产品。',[{key:'owner',label:'负责人实例 ID',required:true},{key:'parent_id',label:'父工单 ID（可选）'},{key:'content',label:'工作说明',required:true,multiline:true}],a=>command('work.create',{workspace:workspace(),...a}))));card.append(buttons);$('content').append(card);const advanced=el('details',undefined,'card');advanced.style.marginTop='18px';advanced.append(el('summary','明确的高级操作（同一套 API）'),el('p','用于导入选定资产、更新、交付、桥接配置等。不会执行任意 shell。','muted'),button('执行平台操作',()=>form('平台操作','命令与参数参见 docs/usage.md 或 aw --help。',[{key:'command',label:'命令',required:true,placeholder:'work.show'},{key:'arguments',label:'参数 JSON',kind:'json',multiline:true,required:true,value:JSON.stringify({workspace:workspace()},null,2)}],a=>command(a.command,a.arguments))));$('content').append(advanced)}
$('create').onclick=()=>{try{
 const w=workspace(),request_id='create-'+crypto.randomUUID(),generated_id='a'+crypto.randomUUID().replaceAll('-','');
 const fields=[{key:'name',label:'名称',required:true,placeholder:'构建助手'},
 {key:'agent_id',label:'实例 ID（可选）',placeholder:'build-helper'},
 {key:'description',label:'自然语言描述（可选）',multiline:true},
 {key:'definition',label:'共享定义路径（可选）',placeholder:'definitions/build-helper'},
 {key:'kind',label:'运行入口',options:[['codex','Codex CLI'],['claude','Claude Code CLI / SDK'],['codebuddy','CodeBuddy Code CLI / SDK'],['manual','手动接入'],['desktop','Codex Desktop（需控制配置）']]},
 ...runtimeFields({}).slice(1),
 {key:'enter',label:'创建后',options:[['no','只创建并保存配置'],['yes','创建并进入新会话']]}];
 form('建立 Agent','使用同一实例创建与运行配置流程。失败沿用原创建请求补齐，不覆盖资料或重复创建会话。Desktop 控制连接需另外明确配置。',fields,async a=>{
  const {kind,enter,model,effort,base_url,env_key,executable,...values}=a;
  const created=await command('agent.create',{workspace:w,...values,agent_id:values.agent_id||generated_id,request_id});
  const target={workspace:w,agent_id:created.id};
  if(['codex','claude','codebuddy'].includes(kind)){
   const profile={model:model||'',effort:effort||'',base_url:base_url||'',env_key:env_key||'',...(executable?{executable}:{})};
   await command(kind==='codex'?'agent.configure-codex':'agent.configure-sdk',{...target,...profile,...(kind==='codex'?{}:{kind})});
  }else await command('agent.configure',{...target,value:{kind}});
  return enter==='yes'?command('agent.start',target):created;
 });
