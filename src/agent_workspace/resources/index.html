<section id="auth" class="auth card hidden" aria-labelledby="auth-title"><h1 id="auth-title">连接本机工作台</h1><p class="muted mt">使用启动命令输出的完整地址，或输入本机控制 Token。Token 不会发送到外部服务。</p><label for="token">本机控制 Token</label><input id="token" type="password" autocomplete="off"><div class="row end mt"><button class="btn primary" id="login">连接</button></div><div id="auth-error" class="error-box mt" role="alert"></div></section>
<div id="app" class="app hidden">

<div class="main-shell"><header class="topbar"><div class="crumb"><button id="mobile-menu" class="btn quiet mobile-menu" aria-label="打开导航">菜单</button><span id="crumb-root">当前空间</span><span>/</span><b id="crumb-current">Agent</b></div><div class="top-actions"><a class="btn quiet" href="/capabilities" target="_blank" rel="noopener noreferrer">当前版本支持范围与限制</a><button class="btn" id="refresh">刷新状态</button></div></header><main class="main"><div id="error" class="error-box" role="alert"></div><div id="pending-operation" class="attention hidden" role="status"></div><section id="content"></section><footer id="state-source" class="page-foot"></footer></main></div>

<script>
'use strict';
const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let token=new URLSearchParams(location.hash.slice(1)).get('token')||sessionStorage.getItem('aw-token')||'';if(location.hash)history.replaceState(null,'',location.pathname);let state={workspaces:[],agents:[],errors:[]},view='agents',selectedAgent=null,agentTab='overview',collabTab='messages',busy=false,lastResult=null,lastTrigger=null,submitAction=null;const cache={messages:new Map(),works:new Map(),assets:new Map(),assetBodies:new Map(),checkpoints:new Map(),skills:new Map(),maintenance:new Map(),doctor:new Map(),transfer:new Map(),workspace:new Map()};
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});let v;try{v=await r.json()}catch{throw new Error('工作台返回了无法读取的响应。')}if(!r.ok||v.ok===false){const e=new Error(v.error||'请求失败');e.code=v.code||'operation_failed';throw e}return v.result}
const command=(name,args={})=>api('/api/execute',{command:name,arguments:args});
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function showResult(value){lastResult=value;$('result-output').textContent=JSON.stringify(value,null,2);$('result').classList.remove('hidden')}
function setError(text=''){$('error').textContent=text}
async function task(fn,{reload=false,renderAfter=true}={}){if(busy)throw new Error('已有操作正在提交，请勿重复。');busy=true;setError();try{const value=await fn();if(value!==undefined)showResult(value);if(reload)await loadState();else if(renderAfter)render();return value}catch(e){setError(e.message);throw e}finally{busy=false}}
function currentWorkspace(){return $('workspace-switch').value||state.workspaces[0]?.alias||''}
function wsMeta(){return state.workspaces.find(w=>w.alias===currentWorkspace())}
function workspaceAgents(){return state.agents.filter(a=>a.workspace===currentWorkspace())}
function agent(id=selectedAgent){return workspaceAgents().find(a=>a.id===id)}
function base(a){return {workspace:a.workspace,agent_id:a.id}}
function joinPath(...parts){const root=parts.shift()||'';const slash=root.includes('\\')?'\\':'/';return [root.replace(/[\\/]+$/,''),...parts.map(v=>String(v||'').replace(/^[\\/]+|[\\/]+$/g,''))].filter(Boolean).join(slash)}
function badge(text,tone=''){return `<span class="badge ${tone}"><span class="dot"></span>${esc(text)}</span>`}
function button(text,action,kind='',attrs=''){return `<button type="button" class="btn ${kind}" data-action="${esc(action)}" ${attrs}>${esc(text)}</button>`}
function pageHead(title,description,actions='',eyebrow='当前 Workspace'){return `<header class="page-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div><div class="actions">${actions}</div></header>`}
function absoluteDirectory(value){const windows=/^[A-Za-z]:|^\\\\/.test(state.default_instance_root||'');const absolute=windows?/^(?:[A-Za-z]:[\\/]|\\\\[^\\/]+[\\/][^\\/]+(?:[\\/]|$))/.test(value):value.startsWith('/');if(!absolute)throw new Error('请填写当前服务所在机器的绝对路径。');return value}
function statusOf(a){if(a.archived)return {text:'已归档',tone:'' ,sub:'身份保留，不会自动进入'};if(a.observation_error)return {text:'状态读取失败',tone:'red',sub:'保留已知身份，不能推断停工'};const phase=a.binding?.phase;if(phase==='active')return {text:'入口已激活',tone:'green',sub:'不等于模型忙闲或自动收件'};if(phase==='starting')return {text:'入口已预留',tone:'amber',sub:'尚未确认新原生会话'};if(phase==='stopping')return {text:'正在交出',tone:'amber',sub:'等待原入口实际停工'};if(a.has_run)return {text:'没有有效入口',tone:'blue',sub:a.handoff?'有可接续交接点':'没有可用交接点，不自动接管'};return {text:'尚未进入',tone:'',sub:'身份与资料可以先准备'} }
function runtimeLabel(a){const kind=a.configured_kind||a.binding?.kind||'manual';const names={codex:'Codex CLI',claude:'Claude Code',codebuddy:'CodeBuddy Code',desktop:'Codex Desktop',manual:'手动入口'};return names[kind]||kind}
function mainAction(a){if(a.observation_error)return button('健康检查','workspace-doctor','warning');if(!a.local_ready)return button('准备本机目录','prepare-directory','primary',`data-id="${esc(a.id)}"`);if(!a.current&&!a.archived)return button(a.has_run?'接手新会话':'进入新会话','agent-start','primary',`data-id="${esc(a.id)}"`);if(a.current)return button('查看当前状态','agent-open','',`data-id="${esc(a.id)}"`);return button('查看资料','agent-open','',`data-id="${esc(a.id)}"`)}
function renderAgents(){const list=workspaceAgents();const errors=list.filter(a=>a.observation_error);let html=pageHead('Agent','持久身份、当前入口、运行器与自动收件分别展示。目录是本机实例副本，不改变共享身份。',button('创建 Agent','create-agent','primary'),'人员与执行入口');if(errors.length)html+=`<div class="attention"><span>${errors.length} 个实例的本机观测不可读。不会据此显示“离线”或提供强制接管。</span>${button('运行健康检查','workspace-doctor')}</div>`;if(!list.length){html+=`<div class="empty"><h2>先建立一个长期存在的工作者</h2><p>没有 Definition 和 Work 也可以开始。创建会明确实例目录和运行配置，但不会替你安排任务。</p>${button('创建 Agent','create-agent','primary')}</div>`;$('content').innerHTML=html;return}html+=`<div class="panel"><div class="list-head"><span>Agent</span><span>入口与状态</span><span>本机目录 / 运行方式</span><span></span></div>${list.map(a=>{const s=statusOf(a);return `<article class="agent-row"><button class="agent-name" data-action="agent-open" data-id="${esc(a.id)}"><span class="avatar">${esc((a.name||a.id).slice(0,1).toUpperCase())}</span><span><strong>${esc(a.name||a.id)}</strong><small>${esc(a.id)} · ${esc(a.workspace)}</small></span></button><div>${badge(s.text,s.tone)}<div class="status-sub">${esc(s.sub)}</div></div><div><div class="runtime-name">${esc(runtimeLabel(a))}</div><div class="runtime-model path">${esc(a.directory||'本机尚未准备实例目录')}</div></div><div class="row-actions">${mainAction(a)}${button('更多','agent-more','quiet',`data-id="${esc(a.id)}"`)}</div></article>`}).join('')}</div>`;$('content').innerHTML=html}
function renderAgent(){const a=agent();if(!a){selectedAgent=null;view='agents';render();return}const s=statusOf(a);let actions=mainAction(a);if(a.current)actions+=button('交出','agent-handoff','',`data-id="${esc(a.id)}"`)+button('换新会话','agent-renew','',`data-id="${esc(a.id)}"`);let html=`<div class="detail-head"><button class="back" data-action="agent-back">← 返回 Agent</button></div>${pageHead(a.name||a.id,`${a.workspace} / ${a.id} · ${s.text}`,actions,'持久实例')}`;const tabs=[['overview','概览'],['assets','资料'],['runtime','运行与配置'],['transfer','交接'],['communication','通信']];html+=`<div class="tabs" role="tablist" aria-label="Agent 详情">${tabs.map(([id,text])=>`<button role="tab" aria-selected="${agentTab===id}" data-action="agent-tab" data-value="${id}" class="${agentTab===id?'active':''}">${text}</button>`).join('')}</div><div id="agent-panel">${agentPanel(a)}</div>`;$('content').innerHTML=html;ensureAgentData(a)}
function agentPanel(a){if(agentTab==='overview')return overviewView(a);if(agentTab==='assets')return assetsView(a);if(agentTab==='runtime')return runtimeView(a);if(agentTab==='transfer')return transferView(a);return communicationAgentView(a)}
function overviewView(a){const s=statusOf(a),cps=cache.checkpoints.get(a.id);return `<div class="grid2"><div class="stack"><section class="card"><div class="card-head"><h2>当前事实</h2>${badge(s.text,s.tone)}</div><dl class="kv"><dt>共享身份</dt><dd>${esc(a.workspace)} / ${esc(a.id)}<small>读取版本 ${esc(a.snapshot_revision||a.revision||'未知')}</small></dd><dt>当前 Binding</dt><dd>${esc(a.current||'无')}<small>${esc(a.binding?.phase||'没有有效入口')}</small></dd><dt>原生会话</dt><dd>${esc(a.binding?.session||'尚无已确认会话')}<small>session=null 或缺失不冒充原生核验</small></dd><dt>运行器</dt><dd>${esc(a.runtime?.state||'未运行')}<small>${a.runtime?.runner_alive===true?'本机锁显示运行器存活':a.runtime?.runner_alive===false?'本机未观察到存活运行器':'未观察'}</small></dd><dt>自动收件</dt><dd>${a.watch?.enabled?'已启用':'关闭'}<small>与原生会话忙闲、执行资格分别计算</small></dd></dl></section><section class="card"><div class="card-head"><h2>检查点</h2>${a.local_ready?button('保存检查点','checkpoint-create','',`data-id="${esc(a.id)}"`):''}</div>${cps?cps.slice(-4).reverse().map(cp=>`<div class="simple-row"><span><strong>${esc(cp.id)}</strong><small>${esc(cp.created_at||'')} · ${esc(cp.revision||'')}</small></span>${button('查看','checkpoint-show','quiet',`data-id="${esc(a.id)}" data-cp="${esc(cp.id)}"`)}</div>`).join('')||'<p class="muted small">还没有已登记检查点。</p>':'<div class="loading">正在读取检查点…</div>'}</section></div><div class="stack"><section class="card"><div class="card-head"><h2>本机接入</h2></div><p class="small">${a.local_ready?'当前安装已登记实例目录':'当前安装尚未准备实例目录'}</p><p class="hint path">${esc(a.directory||joinPath(state.default_instance_root,a.workspace,a.id))}</p><div class="row wrap mt">${button(a.local_ready?'准备另一份副本':'准备目录','prepare-directory','',`data-id="${esc(a.id)}"`)}${a.local_ready?button('同步共享变更','agent-sync','quiet',`data-id="${esc(a.id)}"`):''}</div></section><section class="card"><div class="card-head"><h2>职责与来源</h2></div><p class="small">${esc(a.description||'职责以实例 AGENTS.md 为准。')}</p><div class="row wrap mt">${button('比较共享来源','agent-versions','',`data-id="${esc(a.id)}"`)}${button('管理 Skill','skill-manage','quiet',`data-id="${esc(a.id)}"`)}</div></section><section class="card"><div class="card-head"><h2>状态依据</h2></div><div class="source-line"><span class="dot" style="color:var(--green)"></span><span><strong>共享记录</strong><small>${esc(a.snapshot_revision||'未取得 revision')}</small></span></div><div class="source-line mt"><span class="dot" style="color:var(--blue)"></span><span><strong>本机观测</strong><small>${esc(a.observed_at||state.observed_at||'未知')} · ${esc(a.observation_source?.installation_id||state.installation_id||'未知安装')}</small></span></div></section></div></div>`}
function assetsView(a){if(!a.local_ready)return `<div class="empty"><h2>先准备这份实例的本机副本</h2><p>接入目录不会创建新身份，也不会接管其他环境的执行入口。</p>${button('准备本机目录','prepare-directory','primary',`data-id="${esc(a.id)}"`)}</div>`;const list=cache.assets.get(a.id);if(!list)return '<div class="loading">正在读取资料目录…</div>';const items=Array.isArray(list)?list:(list.assets||list.files||[]);if(!items.length)return `<div class="empty"><h2>当前没有可列出的资料</h2><p>可以新增实例自有资料；平台受管文件仍遵守后端边界。</p>${button('新增资料','asset-new','primary',`data-id="${esc(a.id)}"`)}</div>`;const current=cache.assetBodies.get(a.id);return `<div class="toolbar"><span class="small muted">${items.length} 个条目 · 保存文件与保存检查点分开</span>${button('新增资料','asset-new','',`data-id="${esc(a.id)}"`)}</div><div class="panel file-layout"><nav class="file-nav" aria-label="资料文件">${items.map(item=>{const path=typeof item==='string'?item:item.path;return `<button data-action="asset-read" data-id="${esc(a.id)}" data-path="${esc(path)}" class="${current?.path===path?'active':''}">${esc(path)}</button>`}).join('')}</nav><section class="file-main">${current?`<div class="card-head"><div><h3 class="mono">${esc(current.path)}</h3><p class="hint">revision ${esc(current.revision||'未知')} · 并发冲突保留本地输入</p></div>${button('编辑','asset-edit','',`data-id="${esc(a.id)}"`)}</div><article class="doc">${esc(current.content??current.text??'')}</article>`:'<div class="empty" style="border:0"><h2>选择一份资料</h2><p>读取固定内容不会代 Agent 加载到当前模型上下文。</p></div>'}</section></div>`}
function runtimeView(a){return `<div class="grid2"><div class="stack"><section class="card"><div class="card-head"><h2>运行配置</h2>${button(a.current?'更换配置并交接':'配置运行方式',a.current?'agent-transfer':'agent-configure','',`data-id="${esc(a.id)}"`)}</div><dl class="kv"><dt>Harness / 入口</dt><dd>${esc(runtimeLabel(a))}</dd><dt>当前原生入口</dt><dd>${esc(a.binding?.kind||'无')}<small>${esc(a.binding?.phase||'没有有效 Binding')}</small></dd><dt>配置生效范围</dt><dd>本机实例副本<small>保存配置不会启动模型或替换活动入口</small></dd></dl>${a.current?'<div class="help-box mt">当前入口有效。更换 Harness、服务或模型配置按原交接流程执行，不能直接覆盖运行中的配置。</div>':''}</section><section class="card"><div class="card-head"><h2>会话与运行器</h2></div><dl class="kv"><dt>原生会话</dt><dd>${esc(a.binding?.session||'未确认')}</dd><dt>运行器观测</dt><dd>${esc(a.runtime?.state||'未运行')}</dd><dt>执行资格</dt><dd>${esc(a.current||'无')}</dd><dt>自动收件</dt><dd>${a.watch?.enabled?'已启用':'关闭'}</dd></dl><div class="row wrap mt">${a.current?button(a.watch?.enabled?'关闭自动收件':'开启自动收件','message-watch','',`data-id="${esc(a.id)}"`):''}${a.current?(a.binding?.phase==='stopping'?button('继续确认停止','agent-continue-stop','warning',`data-id="${esc(a.id)}" data-binding="${esc(a.current)}" data-checkpoint="${esc(a.binding.checkpoint||'')}"`):button('启动运行器','runtime-start','',`data-id="${esc(a.id)}"`)):''}${button('仅停止运行器','runtime-stop','quiet',`data-id="${esc(a.id)}"`)}</div><p class="hint mt">停止运行器不释放执行资格，也不证明原生 Agent 已停工。</p></section></div><div class="stack"><section class="card"><div class="card-head"><h2>桌面项目组织</h2></div><p class="small muted">按 Agent 复用项目，Codex 分区按 Workspace 组织。保存引用不表示原生项目已创建或核验。</p><div class="row wrap mt">${button('目录与桌面组织','desktop-project','',`data-id="${esc(a.id)}"`)}${button('连接桌面控制','desktop-configure','quiet',`data-id="${esc(a.id)}"`)}</div></section><section class="card"><h2 style="font-size:15px">低频实例操作</h2><div class="row wrap mt">${button(a.archived?'解除归档':'归档','agent-archive','quiet',`data-id="${esc(a.id)}"`)}${button('更新工具资源','agent-upgrade-tools','quiet',`data-id="${esc(a.id)}"`)}</div></section></div></div>`}
function transferView(a){const value=cache.transfer.get(a.id);return `<div class="grid2"><section class="card"><div class="card-head"><h2>交接事实</h2><div class="row">${button('刷新当前状态','transfer-status','',`data-id="${esc(a.id)}"`)}${button('继续原交接','transfer-continue','warning',`data-id="${esc(a.id)}"`)}</div></div>${value?`<pre class="doc">${esc(JSON.stringify(value,null,2))}</pre>`:'<div class="help-box">只读取真实 transfer / handoff 记录。入口已绑定不等于接手完成；结果未知时沿用原请求，不新建后继。</div>'}</section><section class="card"><h2 style="font-size:15px">动作边界</h2><dl class="kv mt"><dt>只交出</dt><dd>保存检查点并请求当前原生入口停工，不自动启动下一端。</dd><dt>换新会话</dt><dd>固定唯一后继，旧入口释放后才创建或绑定新入口。</dd><dt>切换 Harness</dt><dd>先预检目标配置，再走同一套交接合同。</dd></dl><div class="row wrap mt">${a.current?button('只交出','agent-handoff','',`data-id="${esc(a.id)}"`):''}${a.current?button('换新会话','agent-renew','primary',`data-id="${esc(a.id)}"`):''}${a.current?button('切换 Harness','agent-transfer','',`data-id="${esc(a.id)}"`):''}</div></section></div>`}
function communicationAgentView(a){return `<div class="grid2"><section class="card"><div class="card-head"><h2>正式 Message</h2>${button('从此实例发送','message-send','',`data-from="${esc(a.id)}"`)}</div><p class="hint">只读查看不代 Agent ACK；ACK 也不代表业务完成。</p><div class="row wrap mt">${button('读取消息列表','messages-load','',`data-agent="${esc(a.id)}"`)}${a.current?button(a.watch?.enabled?'关闭自动收件':'开启自动收件','message-watch','quiet',`data-id="${esc(a.id)}"`):''}</div></section><section class="card"><h2 style="font-size:15px">直接安排事情</h2><p class="hint mt">向当前 Agent 输入一项要求。工作台不提供另一套聊天客户端。</p><div class="mt">${button('发送指令','agent-input','',`data-id="${esc(a.id)}"`)}</div></section></div>`}
async function ensureAgentData(a){try{if(agentTab==='assets'&&!cache.assets.has(a.id)){cache.assets.set(a.id,await command('asset.list',base(a)));render()}if(agentTab==='overview'&&!cache.checkpoints.has(a.id)){cache.checkpoints.set(a.id,await command('checkpoint.list',base(a)));render()}}catch(e){setError(e.message)}}
function renderCollaboration(){let html=pageHead('协作','Message、ACK、输入、Work 与 Delivery 各自保留真实语义。',collabTab==='messages'?button('发送 Message','message-send','primary'):button('创建 Work','work-create','primary'),'共享协作事实');html+=`<div class="tabs" role="tablist">${[['messages','消息'],['works','Work 与交付']].map(([id,text])=>`<button role="tab" data-action="collab-tab" data-value="${id}" class="${collabTab===id?'active':''}">${text}</button>`).join('')}</div>${collabTab==='messages'?messagesView():worksView()}`;$('content').innerHTML=html;ensureCollaborationData()}
function messagesView(){const list=cache.messages.get(currentWorkspace());if(!list)return '<div class="loading">正在读取正式消息…</div>';return `<div class="toolbar"><span class="small muted">${list.length} 条消息索引 · 查看不自动 ACK</span>${pendingMessage()?badge('存在未确认发布请求','amber'):badge('没有浏览器待恢复请求','blue')}</div><div class="panel">${list.length?list.slice().reverse().map(m=>`<article class="table-row"><div><button class="title" data-action="message-show" data-id="${esc(m.id)}">${esc(m.id)}</button><small>${esc(m.from?.agent)} → ${esc(m.to?.agent)} · ${esc(m.created_at||'')}</small></div><div>${badge(m.notification_acknowledged?'已确认通知':'已发布，等待确认',m.notification_acknowledged?'green':'')}<div class="hint">${m.notification_acknowledged?'不代表工作完成':'按接收入口能力投递'}</div></div><div>${button('查看','message-show','',`data-id="${esc(m.id)}"`)}</div></article>`).join(''):`<div class="empty" style="border:0"><h2>从一次明确的沟通开始</h2><p>选择有执行资格的发送实例。发布成功不表示接收者已经读取。</p>${button('发送 Message','message-send','primary')}</div>`}</div>`}
function worksView(){const list=cache.works.get(currentWorkspace());if(!list)return '<div class="loading">正在读取正式 Work…</div>';return `<div class="toolbar"><span class="small muted">${list.length} 条正式工作记录 · 不增加看板状态机</span><span class="note-pill">创建不自动通知负责人</span></div><div class="panel">${list.length?list.map(w=>`<article class="table-row"><div><button class="title" data-action="work-show" data-id="${esc(w.id)}">${esc((w.content||'').split('\n')[0]||w.id)}</button><small>${esc(w.id)}${w.parent_id?' · 父项 '+esc(w.parent_id):''}</small></div><div><strong>${esc(w.owner)}</strong><small>负责实例</small></div><div class="row">${badge(w.delivery?'已封存':'未交付',w.delivery?'green':'')}${button('查看','work-show','',`data-id="${esc(w.id)}"`)}</div></article>`).join(''):`<div class="empty" style="border:0"><h2>这里暂时没有 Work</h2><p>不使用工单也可以运行、通信、保存和交接。</p>${button('创建 Work','work-create','primary')}</div>`}</div>`}
async function ensureCollaborationData(){try{if(collabTab==='messages'&&!cache.messages.has(currentWorkspace())){cache.messages.set(currentWorkspace(),await command('message.list',{workspace:currentWorkspace()}));render()}if(collabTab==='works'&&!cache.works.has(currentWorkspace())){cache.works.set(currentWorkspace(),await command('work.list',{workspace:currentWorkspace()}));render()}}catch(e){setError(e.message)}}
function renderShared(){const skills=cache.skills.get(currentWorkspace());let html=pageHead('共享资料','复用职责、Skill 与知识。采用某个版本，不自动同步每个实例。',button('读取指定共同资料','shared-read',''),'Workspace main');if(!skills)html+='<div class="loading">正在读取共享 Skill 目录…</div>';else{const list=skills.skills||[];html+=`<div class="resource-grid">${list.map(item=>`<article class="resource-card">${badge('Skill',item.available?'green':'')}<h2>${esc(item.name)}</h2><p>${esc(item.description||'共享 Skill')}</p><div class="path">${esc(item.path||('skills/'+item.name))}</div><div>${item.available?button('查看采用状态','shared-skill-status','',`data-name="${esc(item.name)}"`):badge('当前来源不可用','amber')}</div></article>`).join('')||'<div class="empty"><h2>当前没有可列出的共享 Skill</h2><p>仍可通过明确路径读取已有 Definition 或知识文件。</p></div>'}</div><div class="help-box mt">工作台没有构造插件市场或虚拟文件树。共同资料按真实 Workspace Git revision 与明确路径读取。</div>`}$('content').innerHTML=html;ensureSharedData()}
