<body>
<section id="auth" class="auth card hidden" aria-labelledby="auth-title"><h1 id="auth-title">连接本机工作台</h1><p class="muted mt">使用启动命令输出的完整地址，或输入本机控制 Token。Token 不会发送到外部服务。</p><label for="token">本机控制 Token</label><input id="token" type="password" autocomplete="off"><div class="row end mt"><button class="btn primary" id="login">连接</button></div><div id="auth-error" class="error-box mt" role="alert"></div></section>
<div id="app" class="app hidden">
<aside id="sidebar" class="sidebar"><div class="brand"><div class="brand-mark">AW</div><div><strong>Agent Workspace</strong><small>WORKBENCH</small></div><button id="close-mobile-menu" class="icon-btn sidebar-close" aria-label="关闭导航">×</button></div><div class="switch"><select id="workspace-switch" aria-label="当前 Workspace"></select></div><div><div class="nav-title">查看与管理本机后台</div><nav class="nav" aria-label="主要导航"><button data-view="agents" class="active">Agent 与运行环境 <span id="agent-count" class="count">0</span></button><button data-view="messages">消息历史</button><button data-view="backend">本机后台</button></nav></div><div class="sidebar-bottom"><div id="local-meta" class="local"></div></div></aside>
<div class="main-shell"><header class="topbar"><div class="crumb"><button id="mobile-menu" class="btn quiet mobile-menu" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">菜单</button><span id="crumb-root">当前空间</span><span>/</span><b id="crumb-current">Agent</b></div><div class="top-actions"><a class="btn quiet" href="/capabilities" target="_blank" rel="noopener noreferrer">当前版本支持范围与限制</a><button class="btn" id="refresh">刷新状态</button></div></header><main class="main"><div id="connection" class="attention hidden" role="status"></div><div id="error" class="error-box" role="alert"></div><div id="pending-operation" class="attention hidden" role="status"></div><section id="content"></section><footer id="state-source" class="page-foot"></footer></main></div>
</div>

<aside id="result" class="result-drawer hidden" aria-live="polite"><div class="result-head"><strong>操作结果</strong><div class="row"><button class="btn quiet" id="copy-result">复制</button><button class="btn quiet" id="close-result">关闭</button></div></div><pre id="result-output"></pre></aside><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let token=new URLSearchParams(location.hash.slice(1)).get('token')||sessionStorage.getItem('aw-token')||'';
if(location.hash)history.replaceState(null,'',location.pathname);
let state={workspaces:[],agents:[],errors:[]};
let view='agents',selectedAgent=null,connected=false,busy=false,lastResult=null;
let messageRows=[],messageAgent='',messageDirection='all',messageReadAt='',messageErrors=[];
let backendState=null,backendLog=null,backendNotice='',logChoice='';
let readGeneration=0;
const nativeObservations=new Map();
const nativeKey=id=>JSON.stringify([wsMeta()?.locator,id]);

async function api(path,body){
 const response=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
 let value;
 try{value=await response.json()}catch{throw new Error('没有取得可读回复，结果尚未确认。请核对原请求。')}
 if(!response.ok||!value.ok)throw new Error(value.error||'本机后台未完成此请求。');
 return value.result;
}
const command=(name,args={})=>api('/api/execute',{command:name,arguments:args});
const currentWorkspace=()=>$('workspace-switch').value||state.workspaces[0]?.alias||'';
const wsMeta=()=>state.workspaces.find(item=>item.alias===currentWorkspace());
const workspaceAgents=()=>state.agents.filter(item=>item.workspace===currentWorkspace());
const agent=(id=selectedAgent)=>workspaceAgents().find(item=>item.id===id);
const badge=(text,tone='')=>`<span class="badge ${tone}"><span class="dot"></span>${esc(text)}</span>`;
const button=(text,action,kind='',attrs='')=>`<button type="button" class="btn ${kind}" data-action="${esc(action)}" ${attrs}>${esc(text)}</button>`;
const kindName=kind=>({codex:'Codex CLI',desktop:'Codex Desktop',claude:'Claude Code',codebuddy:'CodeBuddy Code',manual:'手动入口'}[kind]||kind||'未记录');
const phaseName=phase=>({starting:'执行入口已预留',active:'当前执行资格有效',stopping:'正在等待停工确认',released:'已交出执行资格',revoked:'旧 AW 执行资格已撤销'}[phase]||phase||'入口状态未知');
function showResult(value){lastResult=value;$('result-output').textContent=JSON.stringify(value,null,2);$('result').classList.remove('hidden')}
function setSidebar(open){$('sidebar').classList.toggle('open',open);$('mobile-menu').setAttribute('aria-expanded',String(open))}
function setError(text=''){$('error').textContent=text}
function pageHead(title,description,actions=''){return `<header class="page-head"><div><div class="eyebrow">${esc(currentWorkspace()||'本机安装')}</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div><div class="actions">${actions}</div></header>`}
function observationUnknown(item){
 if(item.observation_error)return '本机状态读取失败';
 if(!item.local_ready)return '本机无副本，未观测';
 return '尚未取得匹配的本机观测';
}
function runtimeState(item){
 if(!item.runtime||((item.observation_error||!item.local_ready)&&item.runtime.state==='unknown'))return observationUnknown(item);
 if(item.runtime.state==='unknown')return '当前执行会话的运行状态未知';
 return ({not_running:'本机未观察到运行器',starting_runner:'运行器正在启动'}[item.runtime.state]||item.runtime.state||'运行器状态未知');
}
function watchLabel(item){return item.watch?.enabled===true?'已启用':item.watch?.enabled===false?'关闭':observationUnknown(item)}
function bindingPhase(item){return item.binding?phaseName(item.binding.phase):(item.current?'当前入口详情未知':'没有有效执行入口')}
function statusOf(item){
 if(item.archived)return {text:'已归档',tone:''};
 if(item.binding)return {text:phaseName(item.binding.phase),tone:item.binding.phase==='active'?'green':'amber'};
 return {text:item.current?'当前入口详情未知':'没有有效执行入口',tone:'blue'};
}
function executionSource(binding){
 if(!binding?.execution)return '来源未记录';
 return `${binding.execution.installation_id} · ${binding.execution.directory}`;
}
function renderAgents(){
 const list=workspaceAgents();
 let html=pageHead('Agent 与运行环境','查看持久身份、当前执行会话和本地副本。执行资格与本机运行状态分别显示。');
 if(!currentWorkspace())html+='<div class="empty"><h2>尚未接入 Workspace</h2><p>请通过原生客户端、CLI 或 Skill 准备协作空间。本机后台仍可独立查看。</p></div>';
 else if(!list.length)html+='<div class="empty"><h2>当前空间没有可显示的 Agent</h2><p>创建与接续操作通过原生客户端、CLI 或 Skills 完成。</p></div>';

async function readMessages(){
 const workspace=currentWorkspace(),generation=++readGeneration;
 if(!workspace){messageRows=[];messageErrors=[];messageReadAt='';return}
 const results=await Promise.allSettled([command('message.list',{workspace}),command('direct-message.list',{workspace})]);
 if(generation!==readGeneration||workspace!==currentWorkspace())return;
 const routes=['aw','direct'],names=['AW Message','原生直发记录'];
 const rows=[],errors=[];
 results.forEach((result,index)=>{
  if(result.status==='fulfilled')for(const record of result.value)rows.push({route:routes[index],record});
  else errors.push(names[index]+'读取失败：'+result.reason.message);
 });
 messageRows=rows.sort((a,b)=>b.record.created_at.localeCompare(a.record.created_at)||a.record.id.localeCompare(b.record.id));
 messageErrors=errors;messageReadAt=new Date().toISOString();
}
function visibleMessages(){

 return messageRows.filter(({record})=>{
  const incoming=record.to?.workspace===locator&&record.to.agent===messageAgent;
  const outgoing=record.from?.workspace===locator&&record.from.agent===messageAgent;
  return messageDirection==='in'?incoming:messageDirection==='out'?outgoing:incoming||outgoing;
 });
}

async function recoverMessage(continueRequest){
 const pending=pendingMessage();
 if(!pending||pending.corrupt)throw new Error('没有可恢复的原消息请求，或本页记录已损坏。');
 if(wsMeta()?.locator!==pending.locator)throw new Error('Workspace locator 已变化，不能把旧请求发往另一个空间。');
 let result=await command('message.operation',{workspace:pending.args.workspace,operation_id:pending.args.request_id});
 if(result.state!=='not_recorded'&&(result.type!=='message'||result.agent!==pending.args.agent_id||result.binding!==pending.args.binding||result.payload?.content!==pending.args.content||result.payload?.delivery!==pending.args.delivery))throw new Error('原操作与本页记录不一致，不能继续发布。');
 if(continueRequest&&result.state!=='published')result=result.state==='not_recorded'?await command('message.send',pending.args):await command('message.reconcile',{operation_id:pending.args.request_id});
 if(result.state==='published')sessionStorage.removeItem(pendingKey());
 showResult(result);
 if(view==='messages')await readMessages();
 render();
}

async function refresh(){

  if(view==='backend'){
   await readBackend();
   if(wasDisconnected&&backendState.ready===true)backendNotice='已重新连接，当前观察到后台就绪。';

 }catch(error){

async function reconnectAfterRestart(previousPid){

  await new Promise(resolve=>setTimeout(resolve,1000));
  try{
   const observed=await command('backend.status');backendState=observed;connected=true;
   if(observed.ready===true&&previousPid&&observed.pid&&observed.pid!==previousPid){backendNotice='已重新连接，观察到新的后台进程就绪。';await refresh();return}
  }catch{connected=false}
 }

 }
 if(action==='message-recover-view'||action==='message-recover-continue'){await recoverMessage(action==='message-recover-continue');return}
 if(action==='message-recover-remove'){if(confirm('只移除当前标签页提示，不撤回或删除已发布消息？')){sessionStorage.removeItem(pendingKey());render()}return}
 if(action==='reconnect'){await refresh();return}
 if(action==='backend-log'){
  const chosen=$('log-source').value;
  backendLog=await command('backend.log',chosen?JSON.parse(chosen):{});
  render();return;
 }
 if(action==='backend-start'||action==='backend-stop'||action==='backend-restart'){
  const previousPid=backendState?.pid;
  try{await command(action.replace('backend-','backend.'))}
  catch(error){backendNotice='未取得控制请求的确定结果。请核对当前后台，不重复发送同一操作。';connected=false;render();if(action==='backend-restart'){await reconnectAfterRestart(previousPid);return}throw error}
  backendNotice=action==='backend-stop'?'后台返回了停止请求结果，尚需确认实际退出。网页断开不能代替退出确认。通过本次安装的 aw backend status 查看最终状态。':action==='backend-restart'?'正在核对重启后的实际后台。':'正在读取后台的实际状态。';
  if(action==='backend-restart'){render();await reconnectAfterRestart(previousPid);return}
  try{await readBackend()}catch{connected=false;backendNotice+=' 当前连接不可用，实际状态尚未确认。'}
  render();return;
 }
}
$('workspace-switch').onchange=async()=>{selectedAgent=null;messageAgent='';messageDirection='all';try{if(view==='messages')await readMessages();render()}catch(error){setError(error.message)}};
$('refresh').onclick=refresh;
$('login').onclick=()=>{token=$('token').value.trim();sessionStorage.setItem('aw-token',token);refresh()};
$('copy-result').onclick=()=>navigator.clipboard.writeText(JSON.stringify(lastResult,null,2));
$('close-result').onclick=()=>$('result').classList.add('hidden');
$('mobile-menu').onclick=()=>setSidebar(!$('sidebar').classList.contains('open'));
$('close-mobile-menu').onclick=()=>{setSidebar(false);$('mobile-menu').focus()};
document.addEventListener('keydown',event=>{if(event.key==='Escape'){setSidebar(false);$('result').classList.add('hidden');$('mobile-menu').focus()}});
document.addEventListener('click',async event=>{
 const nav=event.target.closest('[data-view]'),target=event.target.closest('[data-action]');
 if(!nav&&!target)return;
 if(busy){setError('已有请求正在处理，请等待当前结果。');return}
 busy=true;setError();
 try{if(nav)await switchView(nav.dataset.view);else await handle(target.dataset.action,target)}
 catch(error){setError(error.message)}
 finally{busy=false}
});
if(token){sessionStorage.setItem('aw-token',token);refresh()}else $('auth').classList.remove('hidden');
</script>
</body>
</html>
